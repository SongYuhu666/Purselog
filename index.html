<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purselog - 极简记账</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 主色调定义 */
        :root {
            --primary-color: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary-color: #64748b;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --success-color: #22c55e;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--light-bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 容器 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        header {
            padding: 40px 0;
            text-align: center;
        }

        .app-logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        /* 主内容区 */
        main {
            margin-top: 20px;
        }

        /* 统计卡片区域 */
        .stats-section {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
        }

        /* 时间周期切换器 */
        .period-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .period-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .period-btn:hover {
            border-color: var(--primary-light);
            color: var(--primary-color);
        }

        .period-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--white);
        }

        /* 统计卡片网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        /* 单个统计卡片 */
        .stat-card {
            background: var(--light-bg);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-value.income {
            color: #22c55e;
        }

        .stat-value.expense {
            color: #ef4444;
        }

        .stat-value.positive {
            color: #22c55e;
        }

        .stat-value.negative {
            color: #ef4444;
        }

        /* 添加记录按钮 */
        .add-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: var(--white);
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: var(--radius-lg);
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .add-icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        /* 记录列表 */
        .records-section {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .clear-all-btn {
            background: var(--light-bg);
            color: var(--text-secondary);
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .clear-all-btn:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .records-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
        }

        .record-item:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-sm);
        }

        .record-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .record-type {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .record-type.expense {
            background: #fef2f2;
        }

        .record-type.income {
            background: #f0fdf4;
        }

        .record-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .record-note {
            font-weight: 500;
            color: var(--text-primary);
        }

        .record-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .record-amount {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .record-amount.expense {
            color: #ef4444;
        }

        .record-amount.income {
            color: #22c55e;
        }

        .record-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .delete-btn {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: var(--white);
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 24px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
        }

        .modal-body {
            padding: 24px;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* 金额输入框容器 */
        .amount-input-wrapper {
            position: relative;
        }

        .currency-symbol {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1.1rem;
        }

        .amount-input {
            padding-left: 36px;
        }

        /* 类型选择器 */
        .type-selector {
            display: flex;
            gap: 12px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .type-btn:hover {
            border-color: var(--primary-light);
        }

        .type-btn.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: var(--white);
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-cancel {
            background: var(--light-bg);
            color: var(--text-primary);
        }

        .btn-cancel:hover {
            background: var(--border-color);
        }

        .btn-save {
            background: var(--primary-color);
            color: var(--white);
        }

        .btn-save:hover {
            background: var(--primary-dark);
        }

        /* 成功提示 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success-color);
            color: var(--white);
            padding: 14px 28px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }

            header {
                padding: 30px 0;
            }

            .app-logo {
                font-size: 1.75rem;
            }

            .add-btn {
                padding: 14px 32px;
                font-size: 1rem;
            }

            .modal {
                max-width: 100%;
            }

            .modal-header,
            .modal-body {
                padding: 20px;
            }

            .record-item {
                padding: 14px;
            }

            .record-amount {
                font-size: 1.1rem;
            }

            /* 移动端统计卡片优化 */
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-value {
                font-size: 1.25rem;
            }

            .period-selector {
                flex-wrap: wrap;
            }

            .period-btn {
                flex: 1;
                min-width: 80px;
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header>
            <div class="app-logo">Purselog</div>
            <div class="app-subtitle">极简记账 · 轻松记录</div>
        </header>

        <!-- 主内容 -->
        <main>
            <!-- 统计卡片区域 -->
            <section class="stats-section">
                <!-- 时间周期切换器 -->
                <div class="period-selector">
                    <button class="period-btn" data-period="lastMonth">上月</button>
                    <button class="period-btn active" data-period="currentMonth">本月</button>
                    <button class="period-btn" data-period="currentYear">本年</button>
                </div>

                <!-- 统计卡片网格 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">总收入</div>
                        <div class="stat-value income" id="totalIncome">¥0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">总支出</div>
                        <div class="stat-value expense" id="totalExpense">¥0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">结余</div>
                        <div class="stat-value positive" id="totalBalance">¥0.00</div>
                    </div>
                </div>
            </section>

            <!-- 添加记录按钮 -->
            <div class="add-btn-wrapper">
                <button class="add-btn" id="addBtn">
                    <span class="add-icon">+</span>
                    记一笔
                </button>
            </div>

            <!-- 记录列表 -->
            <section class="records-section">
                <div class="section-header">
                    <h2 class="section-title">最近记录</h2>
                    <button class="clear-all-btn" id="clearAllBtn">清空所有数据</button>
                </div>
                <div class="records-list" id="recordsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <div>暂无记账记录</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 记账模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">记一笔</h3>
                <button class="close-btn" id="closeBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="recordForm">
                    <!-- 类型选择 -->
                    <div class="form-group">
                        <label class="form-label">类型</label>
                        <div class="type-selector">
                            <button type="button" class="type-btn active" data-type="expense">
                                <span>💸</span> 支出
                            </button>
                            <button type="button" class="type-btn" data-type="income">
                                <span>💰</span> 收入
                            </button>
                        </div>
                    </div>

                    <!-- 金额输入 -->
                    <div class="form-group">
                        <label class="form-label">金额</label>
                        <div class="amount-input-wrapper">
                            <span class="currency-symbol">¥</span>
                            <input type="number" class="form-input amount-input" id="amountInput" 
                                   placeholder="0.00" min="0" step="0.01" required>
                        </div>
                    </div>

                    <!-- 备注输入 -->
                    <div class="form-group">
                        <label class="form-label">备注</label>
                        <input type="text" class="form-input" id="noteInput" 
                               placeholder="如：午餐、打车...">
                    </div>

                    <!-- 日期选择 -->
                    <div class="form-group">
                        <label class="form-label">日期</label>
                        <input type="date" class="form-input" id="dateInput" required>
                    </div>

                    <!-- 按钮组 -->
                    <div class="btn-group">
                        <button type="button" class="btn btn-cancel" id="cancelBtn">取消</button>
                        <button type="submit" class="btn btn-save">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal-overlay" id="deleteModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">确认删除</h3>
                <button class="close-btn" id="deleteCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 24px; color: var(--text-secondary);">确定要删除这条记录吗？此操作不可恢复。</p>
                <!-- 按钮组 -->
                <div class="btn-group">
                    <button type="button" class="btn btn-cancel" id="deleteCancelBtn">取消</button>
                    <button type="button" class="btn" style="background: #ef4444; color: white;" id="deleteConfirmBtn">删除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 清空所有数据确认模态框 -->
    <div class="modal-overlay" id="clearAllModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">清空所有数据</h3>
                <button class="close-btn" id="clearAllCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 24px; color: var(--text-secondary);">确定要清空所有记账数据吗？此操作将永久删除所有记录，不可恢复！</p>
                <!-- 按钮组 -->
                <div class="btn-group">
                    <button type="button" class="btn btn-cancel" id="clearAllCancelBtn">取消</button>
                    <button type="button" class="btn" style="background: #ef4444; color: white;" id="clearAllConfirmBtn">清空</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 成功提示 -->
    <div class="toast" id="toast">
        <span>✓</span>
        <span>保存成功！</span>
    </div>

    <script>
        // DOM 元素
        const addBtn = document.getElementById('addBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const recordForm = document.getElementById('recordForm');
        const amountInput = document.getElementById('amountInput');
        const noteInput = document.getElementById('noteInput');
        const dateInput = document.getElementById('dateInput');
        const typeBtns = document.querySelectorAll('.type-btn');
        const recordsList = document.getElementById('recordsList');
        const toast = document.getElementById('toast');
        
        // 删除确认相关 DOM 元素
        const deleteModalOverlay = document.getElementById('deleteModalOverlay');
        const deleteCloseBtn = document.getElementById('deleteCloseBtn');
        const deleteCancelBtn = document.getElementById('deleteCancelBtn');
        const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
        
        // 清空所有数据相关 DOM 元素
        const clearAllBtn = document.getElementById('clearAllBtn');
        const clearAllModalOverlay = document.getElementById('clearAllModalOverlay');
        const clearAllCloseBtn = document.getElementById('clearAllCloseBtn');
        const clearAllCancelBtn = document.getElementById('clearAllCancelBtn');
        const clearAllConfirmBtn = document.getElementById('clearAllConfirmBtn');

        // 统计相关 DOM 元素
        const totalIncomeEl = document.getElementById('totalIncome');
        const totalExpenseEl = document.getElementById('totalExpense');
        const totalBalanceEl = document.getElementById('totalBalance');
        const periodBtns = document.querySelectorAll('.period-btn');

        // 记录数据存储
        let records = [];
        let recordToDelete = null;
        let currentPeriod = 'currentMonth'; // 当前查看的周期

        // localStorage 存储键名
        const STORAGE_KEY = 'purselog_records';

        // 当前选中的类型
        let selectedType = 'expense';

        // 从 localStorage 读取数据
        function loadRecordsFromStorage() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                if (storedData) {
                    records = JSON.parse(storedData);
                }
            } catch (error) {
                console.error('读取 localStorage 数据失败:', error);
                records = [];
            }
        }

        // 保存数据到 localStorage
        function saveRecordsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            } catch (error) {
                console.error('保存到 localStorage 失败:', error);
            }
        }

        // 显示清空所有数据确认模态框
        function showClearAllModal() {
            clearAllModalOverlay.classList.add('active');
        }

        // 隐藏清空所有数据确认模态框
        function hideClearAllModal() {
            clearAllModalOverlay.classList.remove('active');
        }

        // 清空所有数据
        function clearAllRecords() {
            records = [];
            saveRecordsToStorage();
            renderRecords();
            updateStats();
            hideClearAllModal();
        }

        // 获取指定周期的时间范围
        function getPeriodRange(period) {
            const now = new Date();
            let startDate, endDate;

            switch (period) {
                case 'lastMonth':
                    // 上月
                    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                    startDate = new Date(lastMonth.getFullYear(), lastMonth.getMonth(), 1);
                    endDate = new Date(lastMonth.getFullYear(), lastMonth.getMonth() + 1, 0);
                    break;
                case 'currentMonth':
                    // 本月
                    startDate = new Date(now.getFullYear(), now.getMonth(), 1);
                    endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                    break;
                case 'currentYear':
                    // 本年
                    startDate = new Date(now.getFullYear(), 0, 1);
                    endDate = new Date(now.getFullYear(), 11, 31);
                    break;
            }

            return {
                start: startDate.toISOString().split('T')[0],
                end: endDate.toISOString().split('T')[0]
            };
        }

        // 更新统计数据
        function updateStats() {
            const { start, end } = getPeriodRange(currentPeriod);

            // 筛选指定周期内的记录
            const filteredRecords = records.filter(record => {
                return record.date >= start && record.date <= end;
            });

            // 计算总收入和总支出
            let totalIncome = 0;
            let totalExpense = 0;

            filteredRecords.forEach(record => {
                if (record.type === 'income') {
                    totalIncome += record.amount;
                } else if (record.type === 'expense') {
                    totalExpense += record.amount;
                }
            });

            // 计算结余
            const balance = totalIncome - totalExpense;

            // 更新显示
            totalIncomeEl.textContent = `¥${totalIncome.toFixed(2)}`;
            totalExpenseEl.textContent = `¥${totalExpense.toFixed(2)}`;
            totalBalanceEl.textContent = `¥${balance.toFixed(2)}`;

            // 根据结余正负设置颜色
            if (balance >= 0) {
                totalBalanceEl.className = 'stat-value positive';
            } else {
                totalBalanceEl.className = 'stat-value negative';
            }
        }

        // 时间周期切换
        periodBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有按钮的 active 类
                periodBtns.forEach(b => b.classList.remove('active'));
                // 添加当前按钮的 active 类
                btn.classList.add('active');
                // 更新当前周期
                currentPeriod = btn.dataset.period;
                // 更新统计数据
                updateStats();
            });
        });

        // 设置默认日期为今天
        function setDefaultDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            dateInput.value = `${year}-${month}-${day}`;
        }

        // 显示模态框
        function showModal() {
            modalOverlay.classList.add('active');
            amountInput.focus();
        }

        // 隐藏模态框
        function hideModal() {
            modalOverlay.classList.remove('active');
            resetForm();
        }

        // 重置表单
        function resetForm() {
            recordForm.reset();
            selectedType = 'expense';
            typeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === 'expense');
            });
            setDefaultDate();
        }

        // 显示提示信息
        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 显示删除确认模态框
        function showDeleteModal(recordId) {
            recordToDelete = recordId;
            deleteModalOverlay.classList.add('active');
        }

        // 隐藏删除确认模态框
        function hideDeleteModal() {
            deleteModalOverlay.classList.remove('active');
            recordToDelete = null;
        }

        // 删除记录
        function deleteRecord(recordId) {
            records = records.filter(record => record.id !== recordId);
            saveRecordsToStorage();
            renderRecords();
            hideDeleteModal();
        }

        // 类型选择
        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedType = btn.dataset.type;
            });
        });

        // 保存记录
        recordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // 获取表单数据
            const amount = parseFloat(amountInput.value);
            const note = noteInput.value || (selectedType === 'expense' ? '支出' : '收入');
            const date = dateInput.value;

            // 创建记录对象
            const record = {
                id: Date.now(),
                type: selectedType,
                amount: amount,
                note: note,
                date: date
            };

            // 添加到记录数组
            records.unshift(record);
            
            // 保存到 localStorage
            saveRecordsToStorage();

            // 重新渲染记录列表
            renderRecords();

            // 更新统计数据
            updateStats();

            // 显示成功提示
            showToast();

            // 隐藏模态框
            hideModal();
        });

        // 渲染记录列表
        function renderRecords() {
            if (records.length === 0) {
                recordsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <div>暂无记账记录</div>
                    </div>
                `;
                return;
            }

            // 按日期倒序排列（最新的在最上面）
            const sortedRecords = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));

            recordsList.innerHTML = sortedRecords.map(record => {
                const typeIcon = record.type === 'expense' ? '💸' : '💰';
                const amountPrefix = record.type === 'expense' ? '-' : '+';
                const dateStr = formatDate(record.date);

                return `
                    <div class="record-item">
                        <div class="record-left">
                            <div class="record-type ${record.type}">
                                ${typeIcon}
                            </div>
                            <div class="record-info">
                                <div class="record-note">${record.note}</div>
                                <div class="record-date">${dateStr}</div>
                            </div>
                        </div>
                        <div class="record-right">
                            <div class="record-amount ${record.type}">
                                ${amountPrefix}¥${record.amount.toFixed(2)}
                            </div>
                            <button class="delete-btn" onclick="showDeleteModal(${record.id})">删除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${year}年${month}月${day}日`;
        }

        // 事件监听
        addBtn.addEventListener('click', showModal);
        closeBtn.addEventListener('click', hideModal);
        cancelBtn.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                hideModal();
            }
        });

        // 删除确认模态框事件监听
        deleteCloseBtn.addEventListener('click', hideDeleteModal);
        deleteCancelBtn.addEventListener('click', hideDeleteModal);
        deleteConfirmBtn.addEventListener('click', () => {
            if (recordToDelete) {
                deleteRecord(recordToDelete);
            }
        });
        deleteModalOverlay.addEventListener('click', (e) => {
            if (e.target === deleteModalOverlay) {
                hideDeleteModal();
            }
        });
        
        // 清空所有数据相关事件监听
        clearAllBtn.addEventListener('click', showClearAllModal);
        clearAllCloseBtn.addEventListener('click', hideClearAllModal);
        clearAllCancelBtn.addEventListener('click', hideClearAllModal);
        clearAllConfirmBtn.addEventListener('click', clearAllRecords);
        clearAllModalOverlay.addEventListener('click', (e) => {
            if (e.target === clearAllModalOverlay) {
                hideClearAllModal();
            }
        });

        // 初始化
        loadRecordsFromStorage();
        setDefaultDate();
        renderRecords();
        updateStats();
    </script>
</body>
</html>
